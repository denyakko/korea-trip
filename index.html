//     window.storage.get / set / delete の呼び出しを

const firebaseConfig = {
  apiKey: "AIzaSyDzp0Qic-QYPSj-1BuVvQIG66Y3vjohV1M",
  authDomain: "korea-trip-app.firebaseapp.com",

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// 現在ログイン中のユーザーと、所属グループのID
let CURRENT_UID = null;
let CURRENT_GROUP_ID = null;

function docRefFor(key, shared) {
  if (!CURRENT_GROUP_ID) throw new Error("no group joined yet");
  if (shared) {
    return db.collection("groups").doc(CURRENT_GROUP_ID).collection("shared").doc(key);
  }
  return db
    .collection("groups")
    .doc(CURRENT_GROUP_ID)
    .collection("users")
    .doc(CURRENT_UID)
    .collection("personal")
    .doc(key);
}

// window.storage と同じ見た目のAPI（get/set/delete）をFirestoreで実装
window.storage = {
  async get(key, shared) {
    const snap = await docRefFor(key, shared).get();
    if (!snap.exists) {
      throw new Error("key not found: " + key);
    }
    const data = snap.data();
    return { key, value: data.value, shared: !!shared };
  },

  async set(key, value, shared) {
    await docRefFor(key, shared).set({
      value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: CURRENT_UID,
    });
    return { key, value, shared: !!shared };
  },

  async delete(key, shared) {
    await docRefFor(key, shared).delete();
    return { key, deleted: true, shared: !!shared };
  },
};

// ------------------------------------------------------------
// グループの作成／参加
// ------------------------------------------------------------

// 招待リンクは ?g=<グループID> の形。これを読み取る
function getInviteGroupIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("g");
}

// このユーザーが既にどこかのグループに所属しているか調べる
async function findMyGroupId(uid) {
  const doc = await db.collection("users").doc(uid).get();
  if (doc.exists) return doc.data().groupId || null;
  return null;
}

// 招待リンク経由でグループに参加する（初参加の記録を書き込む）
async function joinGroup(uid, email, groupId) {
  await db.collection("users").doc(uid).set({ groupId, email }, { merge: true });
  await db
    .collection("groups")
    .doc(groupId)
    .set(
      {
        members: firebase.firestore.FieldValue.arrayUnion({ uid, email }),
      },
      { merge: true }
    );
}

// 新しいグループを作る（一番最初にアプリを使う人向け）
async function createGroup(uid, email) {
  const ref = db.collection("groups").doc(); // 自動採番ID
  await ref.set({
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    createdBy: uid,
    members: [{ uid, email }],
  });
  await db.collection("users").doc(uid).set({ groupId: ref.id, email }, { merge: true });
  return ref.id;
}

</script>

// ============================================================
// AuthGate: ログイン → グループ参加 が終わってから
// 中身（旅行アプリ本体）を表示するコンポーネント
// ============================================================

function AuthGate({ children }) {
  const [status, setStatus] = React.useState("checking"); // checking | login | needsGroup | ready | error
  const [user, setUser] = React.useState(null);
  const [errorMsg, setErrorMsg] = React.useState("");
  const [creatingGroup, setCreatingGroup] = React.useState(false);
  const [loggingIn, setLoggingIn] = React.useState(false);

  const resolveGroup = async (u) => {
    setUser(u);
    CURRENT_UID = u.uid;
    try {
      let groupId = await findMyGroupId(u.uid);
      const inviteId = getInviteGroupIdFromUrl();
      if (!groupId && inviteId) {
        await joinGroup(u.uid, u.email, inviteId);
        groupId = inviteId;
      }
      if (!groupId) {
        setStatus("needsGroup");
        return;
      }
      CURRENT_GROUP_ID = groupId;
      setStatus("ready");
    } catch (e) {
      console.error(e);
      setErrorMsg("グループ情報の読み込みに失敗しました。");
      setStatus("error");
    }
  };

  React.useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => {
      if (!u) {
        setUser(null);
        setStatus("login");
        return;
      }
      resolveGroup(u);
    });
    return unsub;
  }, []);

  const handleLogin = async () => {
    setErrorMsg("");
    setLoggingIn(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
      // onAuthStateChanged が続きを処理する
    } catch (e) {
      console.error("login failed", e);
      setErrorMsg("ログインに失敗しました（" + (e.code || e.message) + "）。もう一度お試しください。");
    } finally {
      setLoggingIn(false);
    }
  };

  const handleCreateGroup = async () => {
    setCreatingGroup(true);
    try {
      const groupId = await createGroup(user.uid, user.email);
      CURRENT_GROUP_ID = groupId;
      setStatus("ready");
    } catch (e) {
      console.error(e);
      setErrorMsg("グループの作成に失敗しました。");
    } finally {
      setCreatingGroup(false);
    }
  };

  const inviteLink =
    CURRENT_GROUP_ID
      ? `${window.location.origin}${window.location.pathname}?g=${CURRENT_GROUP_ID}`
      : "";

  const shell = (content) => (
    <div
      className="min-h-screen flex items-center justify-center px-6"
      style={{ background: "#FBF2E6" }}
    >
      <div className="max-w-sm w-full text-center">{content}</div>
    </div>
  );

  if (status === "checking") {
    return shell(<p style={{ color: "#A48E7C" }}>読み込み中…</p>);
  }

  if (status === "error") {
    return shell(<p style={{ color: "#DD8E98" }}>{errorMsg}</p>);
  }

  if (status === "login") {
    return shell(
      <>
        <h1 className="text-xl font-bold mb-2" style={{ color: "#5C4535" }}>
          韓国行きませんか？
        </h1>
        <p className="text-sm mb-6" style={{ color: "#A48E7C" }}>
          旅の情報をみんなで共有するには、Googleアカウントでログインしてください
        </p>
        {errorMsg && (
          <p className="text-xs mb-3" style={{ color: "#DD8E98" }}>
            {errorMsg}
          </p>
        )}
        <button
          onClick={handleLogin}
          disabled={loggingIn}
          className="px-5 py-2.5 rounded-full text-sm font-medium"
          style={{ background: "#DD8E98", color: "white" }}
        >
          {loggingIn ? "ログイン中…" : "Googleでログイン"}
        </button>
      </>
    );
  }

  if (status === "needsGroup") {
    return shell(
      <>
        <h1 className="text-lg font-bold mb-2" style={{ color: "#5C4535" }}>
          まだどのグループにも参加していません
        </h1>
        <p className="text-sm mb-6" style={{ color: "#A48E7C" }}>
          仲間から届いた招待リンクを開いてログインすると、自動でそのグループに参加します。
          <br />
          まだ誰も旅を始めていない場合は、あなたが新しくグループを作れます。
        </p>
        {errorMsg && (
          <p className="text-xs mb-3" style={{ color: "#DD8E98" }}>
            {errorMsg}
          </p>
        )}
        <button
          onClick={handleCreateGroup}
          disabled={creatingGroup}
          className="px-5 py-2.5 rounded-full text-sm font-medium"
          style={{ background: "#DD8E98", color: "white" }}
        >
          {creatingGroup ? "作成中…" : "新しくグループを作る"}
        </button>
      </>
    );
  }

  // ready
  return children;
}

const WEEKDAYS_JA = ["日", "月", "火", "水", "木", "金", "土"];
function fmtDateWithWeekday(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr.slice(5);
  return `${dateStr.slice(5)}(${WEEKDAYS_JA[d.getDay()]})`;
}

function krwToJpy(krw, rate) {
  const n = parseFloat(krw) || 0;
  return (n / 1000) * (parseFloat(rate) || 0);
}
const yen = (n) => `¥${Math.round(n).toLocaleString()}`;

// balances: [{ member, balance }] where balance > 0 means "should receive"
// Returns minimal list of { from, to, amount } transactions to settle up.
function settleDebts(balances) {
  const EPS = 1; // ignore differences under 1 yen
  const creditors = balances
    .filter((b) => b.balance > EPS)
    .map((b) => ({ member: b.member, amount: b.balance }))
    .sort((a, b) => b.amount - a.amount);
  const debtors = balances
    .filter((b) => b.balance < -EPS)
    .map((b) => ({ member: b.member, amount: -b.balance }))
    .sort((a, b) => b.amount - a.amount);

  const result = [];
  let i = 0,
    j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amount, creditors[j].amount);
    result.push({ from: debtors[i].member, to: creditors[j].member, amount: pay });
    debtors[i].amount -= pay;
    creditors[j].amount -= pay;
    if (debtors[i].amount <= EPS) i++;
    if (creditors[j].amount <= EPS) j++;
  }
  return result;
}

// 金額入力：3桁カンマ区切りで表示しつつ、値は数字文字列で保持
function MoneyInput({ value, onChange, placeholder = "0", className = "", style = {} }) {
  const display = value === "" || value === null || value === undefined
    ? ""
    : Number(value).toLocaleString("en-US");
  const handleChange = (e) => {
    const raw = e.target.value.replace(/[^0-9]/g, "");
    onChange(raw);
  };
  return (
    <input
      type="text"
      inputMode="numeric"
      value={display}
      onChange={handleChange}
      placeholder={placeholder}
      className={`w-full rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 ${className}`}
      style={{ ...inputStyle, fontFamily: "'Quicksand', monospace", ...style }}
      onFocus={(e) => (e.target.style.borderColor = C.persimmon)}
      onBlur={(e) => (e.target.style.borderColor = C.line)}
    />
  );
}

function Btn({ children, onClick, variant = "solid", className = "", type = "button" }) {
  const styles =
    variant === "solid"
      ? { background: C.persimmon, color: "white", letterSpacing: "0.02em" }
      : variant === "ghost"
      ? { background: "transparent", color: C.night, border: `1px solid ${C.line}` }
      : { background: C.night, color: "white" };
  return (
    <button
      type={type}
      onClick={onClick}
      className={`px-3 py-2 rounded-lg text-sm font-medium inline-flex items-center gap-1.5 active:scale-95 transition ${className}`}
      style={styles}
    >
      {children}
    </button>
  );
}

function IconBtn({ onClick, title, danger }) {
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    if (!confirming) return;
    const t = setTimeout(() => setConfirming(false), 3000);
    return () => clearTimeout(t);
  }, [confirming]);

  if (danger) {
    return (
      <button
        onClick={() => {
          if (confirming) {
            setConfirming(false);
            onClick();
          } else {
            setConfirming(true);
          }
        }}
        title={confirming ? "もう一度押すと削除されます" : title}
        className="p-1.5 rounded-md transition inline-flex items-center gap-1"
        style={
          confirming
            ? { background: C.persimmon, color: "white" }
            : { color: C.persimmon }
        }
      >
        <Trash2 size={16} />
        {confirming && <span className="text-[10px] font-medium pr-0.5">削除？</span>}
      </button>
    );
  }
  return (
    <button
      onClick={onClick}
      title={title}
      className="p-1.5 rounded-md hover:opacity-70 transition"
      style={{ color: C.inkSoft }}
    >
      <Trash2 size={16} />
    </button>
  );
}

function Empty({ text }) {
  return (

    </div>

}

// ---------- App ----------
function App() {
  const [loading, setLoading] = useState(true);
  const [trips, setTrips] = useState([]); // [{ id, year }] — id は固有、year は表示用ラベル（重複OK）
  const [tripId, setTripId] = useState(null);
  const [trip, setTrip] = useState(emptyTrip());
  const [prevReflection, setPrevReflection] = useState([]);
  const [prevMembers, setPrevMembers] = useState([]);
  const [tab, setTab] = useState("home");
  const [moneyView, setMoneyView] = useState("detail");
  const [myId, setMyId] = useState(null); // 「あなたは誰？」の選択。アプリ全体で共有（端末ごとに記憶されます）
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved

  const currentYear = trips.find((t) => t.id === tripId)?.year || "";

  const chooseMyId = async (id) => {
    setMyId(id);
    try {
      await window.storage.set(`whoAmI:${tripId}`, id || "", false);
    } catch (e) {
      console.error("whoAmI save failed", e);
    }
  };

  // load trips + current trip on mount
  useEffect(() => {
    (async () => {
      try {
        let list = null;
        try {
          const res = await window.storage.get("trips", true);
          list = res ? JSON.parse(res.value) : null;
        } catch {
          list = null;
        }
        if (!list) {
          // 旧バージョン（年=ID）からの移行。既存データが消えないよう、id=年のまま引き継ぐ
          let yrs = [];
          try {
            const res = await window.storage.get("years", true);
            yrs = res ? JSON.parse(res.value) : [];
          } catch {
            yrs = [];
          }
          if (yrs.length === 0) yrs = [new Date().getFullYear().toString()];
          list = [...yrs].sort().map((y) => ({ id: y, year: y }));
          await window.storage.set("trips", JSON.stringify(list), true);
        }
        setTrips(list);
        const latest = list[list.length - 1];
        setTripId(latest.id);
        await loadTrip(latest.id, list);
      } catch (e) {
        console.error(e);
      } finally {
        setLoading(false);
      }
    })();
    // eslint-disable-next-line
  }, []);

  const loadTrip = async (id, tripsList = trips) => {
    try {
      const res = await window.storage.get(`trip:${id}`, true);
      setTrip(res ? JSON.parse(res.value) : emptyTrip());
    } catch {
      setTrip(emptyTrip());
    }
    // this device's "who am I" choice for this trip（personal, not shared with the group）
    try {
      const res = await window.storage.get(`whoAmI:${id}`, false);
      setMyId(res && res.value ? res.value : null);
    } catch {
      setMyId(null);
    }
    // load the previous trip's reflection notes to show on this trip's home
    const idx = tripsList.findIndex((t) => t.id === id);
    const prevTrip = idx > 0 ? tripsList[idx - 1] : null;
    if (prevTrip) {
      try {
        const res = await window.storage.get(`trip:${prevTrip.id}`, true);
        const prev = res ? JSON.parse(res.value) : null;
        setPrevReflection(prev?.reflection || []);
        setPrevMembers(prev?.members || []);
      } catch {
        setPrevReflection([]);
        setPrevMembers([]);
      }
    } else {
      setPrevReflection([]);
      setPrevMembers([]);
    }
  };

  const save = useCallback(
    async (nextTrip, id = tripId) => {
      setTrip(nextTrip);
      setSaveState("saving");
      try {
        const result = await window.storage.set(`trip:${id}`, JSON.stringify(nextTrip), true);
        setSaveState(result ? "saved" : "idle");
        setTimeout(() => setSaveState("idle"), 1200);
      } catch (e) {
        console.error("save failed", e);
        setSaveState("idle");
      }
    },
    [tripId]
  );

  const switchTrip = async (id) => {
    setTripId(id);
    setLoading(true);
    await loadTrip(id);
    setLoading(false);
  };

  const [yearDraft, setYearDraft] = useState(null); // null = form hidden, else string being typed（次の旅の「年」ラベル）
  const [showSettings, setShowSettings] = useState(false);
  const [yearError, setYearError] = useState("");

  const startAddYear = () => {
    const lastYear = trips[trips.length - 1]?.year || new Date().getFullYear().toString();
    setYearError("");
    setYearDraft((parseInt(lastYear) + 1).toString());
  };

  const cancelAddYear = () => {
    setYearDraft(null);
    setYearError("");
  };

  const confirmAddYear = async () => {
    const y = (yearDraft || "").trim();
    if (!/^\d{4}$/.test(y)) {
      setYearError("4桁の年（例: 2026）で入力してください");
      return;
    }
    const newTrip = { id: uid(), year: y };
    const newTrips = [...trips, newTrip];
    setTrips(newTrips);
    await window.storage.set("trips", JSON.stringify(newTrips), true);
    setYearDraft(null);
    setYearError("");
    await switchTrip(newTrip.id);
  };

  const deleteTrip = async (id) => {
    if (trips.length <= 1) return; // 最後の1件は消せない
    const newTrips = trips.filter((t) => t.id !== id);
    setTrips(newTrips);
    await window.storage.set("trips", JSON.stringify(newTrips), true);
    try {
      await window.storage.delete(`trip:${id}`, true);
    } catch (e) {
      console.error("trip data delete failed", e);
    }
    if (id === tripId) {
      const next = newTrips[newTrips.length - 1];
      await switchTrip(next.id);
    }
  };

  if (loading) {
    return (
      <div className="min-h-[500px] flex items-center justify-center" style={{ background: C.cream }}>
        <Loader2 className="animate-spin" color={C.persimmon} size={28} />
      </div>
    );
  }

  return (
    <div
      style={{
        background: `radial-gradient(circle at 1px 1px, ${C.line} 1px, transparent 0) 0 0/16px 16px, ${C.cream}`,
        minHeight: "100%",
        fontFamily: "'Zen Maru Gothic', sans-serif",
      }}
    >
      <style>{FONTS}</style>
      <Header
        year={currentYear}
        subtitle={trip.subtitle}
        saveState={saveState}
        onOpenSettings={() => setShowSettings(true)}
      />
      {showSettings && (
        <YearSettingsModal
          trips={trips}
          tripId={tripId}
          onSwitch={switchTrip}
          onDelete={deleteTrip}
          onClose={() => {
            setShowSettings(false);
            cancelAddYear();
          }}
          yearDraft={yearDraft}
          onStartAddYear={startAddYear}
          onChangeYearDraft={setYearDraft}
          onConfirmAddYear={confirmAddYear}
          onCancelAddYear={cancelAddYear}
          yearError={yearError}
          subtitle={trip.subtitle}
          onChangeSubtitle={(v) => save({ ...trip, subtitle: v })}
        />
      )}
      <TabBar tab={tab} setTab={setTab} />
      <main className="max-w-3xl mx-auto px-4 pb-16 pt-5">
        {tab === "home" && (
          <Home
            trip={trip}
            year={currentYear}
            setTab={setTab}
            save={save}
            prevReflection={prevReflection}
            myId={myId}
            onSelectMe={chooseMyId}
            onOpenMoneyResult={() => {
              setMoneyView("result");
              setTab("money");
            }}
          />
        )}
        {tab === "registration" && <Registration trip={trip} save={save} />}
        {tab === "hotel" && <HotelTab trip={trip} save={save} />}
        {tab === "schedule" && <ScheduleTab trip={trip} save={save} myId={myId} />}
        {tab === "money" && <Money trip={trip} save={save} myId={myId} initialView={moneyView} />}
        {tab === "wishlist" && <Wishlist trip={trip} save={save} />}
        {tab === "shopping" && <ShoppingTab trip={trip} save={save} myId={myId} />}
        {tab === "packing" && <Packing trip={trip} save={save} myId={myId} setMyId={chooseMyId} setTab={setTab} />}
        {tab === "summary" && <Summary trip={trip} save={save} myId={myId} setMyId={chooseMyId} setTab={setTab} />}
      </main>
    </div>
  );
}

function useCountUp(target, durationMs = 700) {
  const [n, setN] = useState(0);
  useEffect(() => {
    let raf;
    const start = performance.now();
    const from = 0;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / durationMs);
      const eased = 1 - Math.pow(1 - t, 3);
      setN(Math.round(from + (target - from) * eased));
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return n;
}

function Ring({ pct, color, size = 68, label, sub }) {
  const stroke = 7;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const [filled, setFilled] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setFilled(pct), 80);
    return () => clearTimeout(t);
  }, [pct]);
  return (
    <div className="flex flex-col items-center gap-1.5">
      <div className="relative" style={{ width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.line} strokeWidth={stroke} />
          <circle
            cx={size / 2}
            cy={size / 2}
            r={r}
            fill="none"
            stroke={color}
            strokeWidth={stroke}
            strokeLinecap="round"
            strokeDasharray={c}
            strokeDashoffset={c - (filled / 100) * c}
            style={{ transition: "stroke-dashoffset 900ms cubic-bezier(.22,1,.36,1)" }}
          />
        </svg>
        <div
          className="absolute inset-0 flex items-center justify-center text-sm font-bold"
          style={{ color: C.ink, fontFamily: "'M PLUS Rounded 1c', sans-serif" }}
        >
          {pct}%
        </div>
      </div>
      <div className="text-center">
        <div className="text-xs font-medium" style={{ color: C.ink }}>{label}</div>
        {sub && <div className="text-[10px]" style={{ color: C.inkSoft }}>{sub}</div>}
      </div>
    </div>
  );
}

  useEffect(() => {
    if (!first) return;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const startD = new Date(first);
    const daysUntil = Math.ceil((startD - today) / 86400000);
    if (daysUntil > 15 || daysUntil < -1) {
      setState("toofar");
      return;
    }
    setState("loading");
    const end = last || first;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&start_date=${first}&end_date=${end}`;
    fetch(url)
      .then((r) => r.json())
      .then((json) => {
        if (json?.daily?.time) {
          setData(json.daily);
          setState("ok");
        } else {
          setState("error");
        }
      })
      .catch(() => setState("error"));
  }, [first, last]);

  if (!first || state === "idle" || state === "toofar" || state === "error") return null;

  return (
    <Card>
      <div className="text-sm font-medium mb-3" style={{ color: C.ink }}>
        ソウルの天気予報
      </div>
      {state === "loading" && (
        <p className="text-xs" style={{ color: C.inkSoft }}>
          読み込み中…
        </p>
      )}
      {state === "ok" && data && (
        <div className="flex gap-3 overflow-x-auto pb-1">
          {data.time.map((d, i) => (
            <div key={d} className="flex flex-col items-center shrink-0" style={{ minWidth: 52 }}>
              <span className="text-[11px]" style={{ color: C.inkSoft }}>
                {fmtDateWithWeekday(d)}
              </span>
              <span className="text-2xl my-1">{weatherEmoji(data.weathercode[i])}</span>
              <span className="text-xs font-medium" style={{ color: C.persimmon }}>
                {Math.round(data.temperature_2m_max[i])}°
              </span>
              <span className="text-xs" style={{ color: C.inkSoft }}>
                {Math.round(data.temperature_2m_min[i])}°
              </span>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

// 100%達成時に一瞬だけ出る紙吹雪演出
const CONFETTI_COLORS = ["#DD8E98", "#8FAE93", "#DDAA4E", "#6B4738", "#FBF0DC"];
function Confetti() {
  const pieces = React.useMemo(
    () =>
      Array.from({ length: 26 }).map((_, i) => ({
        id: i,
        left: Math.random() * 100,
        delay: Math.random() * 0.3,
        duration: 1.6 + Math.random() * 0.8,
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        rotate: Math.random() * 360,
        size: 6 + Math.random() * 6,
      })),
    []
  );
  return (
    <div
      className="fixed inset-0 pointer-events-none overflow-hidden"
      style={{ zIndex: 60 }}
      aria-hidden="true"
    >
      <style>{`
        @keyframes confetti-fall {
          0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
          100% { transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
        }
      `}</style>
      {pieces.map((p) => (
        <div
          key={p.id}
          style={{
            position: "absolute",
            left: `${p.left}%`,
            top: 0,
            width: p.size,
            height: p.size * 1.4,
            background: p.color,
            borderRadius: 2,
            animation: `confetti-fall ${p.duration}s ease-in ${p.delay}s forwards`,
          }}
        />
      ))}
    </div>
  );
}

    0
  );
  const myPaidJpy = trip.expenses
    .filter((e) => e.payerId === myId)
    .reduce((s, e) => s + krwToJpy(e.amountKrw, e.exchangeRate || trip.exchangeRate), 0);
  const myPaidKrw = trip.expenses
    .filter((e) => e.payerId === myId)
    .reduce((s, e) => s + (parseFloat(e.amountKrw) || 0), 0);
  const dates = Object.values(trip.travel)
    .flatMap((t) => [t.startDate, t.endDate])
    .filter(Boolean)
    .sort();
  const first = dates[0];
  const last = dates[dates.length - 1];

  const heroPhotoInputId = "hero-photo-input";
  const handlePhotoChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();

      save({ ...trip, heroPhoto: reader.result });

    reader.readAsDataURL(file);
    e.target.value = "";

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const firstDate = first ? new Date(first) : null;
  const lastDate = last ? new Date(last) : null;
  let dday = null;
  let phase = "before"; // before | during | after | unset
  if (firstDate) {
    const diffDays = Math.ceil((firstDate - today) / 86400000);
    if (lastDate && today > lastDate) {
      phase = "after";
    } else if (diffDays <= 0 && lastDate && today <= lastDate) {
      phase = "during";

function Registration({ trip, save }) {
  const [name, setName] = useState("");
  const [emoji, setEmoji] = useState(MEMBER_EMOJIS[0]);
  const [expanded, setExpanded] = useState({});
  const toggle = (id) => setExpanded((e) => ({ ...e, [id]: !e[id] }));

  const addMember = () => {
    if (!name.trim()) return;
    const m = { id: uid(), name: name.trim(), emoji, motto: "" };
    save({ ...trip, members: [...trip.members, m] });
    setName("");
    setEmoji(MEMBER_EMOJIS[0]);
  };

  const removeMember = (id) => {
    const { [id]: _, ...restTravel } = trip.travel;
    const { [id]: __, ...restWishlist } = trip.wishlist;
    save({
      ...trip,
      members: trip.members.filter((m) => m.id !== id),
      travel: restTravel,
      wishlist: restWishlist,
      schedule: trip.schedule.map((s) => ({ ...s, memberIds: s.memberIds.filter((x) => x !== id) })),
      expenses: trip.expenses.map((e) => ({
        ...e,
        participants: (e.participants || []).filter((x) => x !== id),
      })),
    });
  };

  const setMemberEmoji = (id, em) => {
    save({ ...trip, members: trip.members.map((m) => (m.id === id ? { ...m, emoji: em } : m)) });
  };
  const setMemberMotto = (id, motto) => {
    save({ ...trip, members: trip.members.map((m) => (m.id === id ? { ...m, motto } : m)) });
  };
  const update = (memberId, patch) => {
    const newTravel = { ...(trip.travel[memberId] || {}), ...patch };
    const member = trip.members.find((m) => m.id === memberId);
    let schedule = trip.schedule;

    const upsertOrRemove = (id, condition, itemFields) => {
      if (condition) {
        const idx = schedule.findIndex((s) => s.id === id);
        if (idx >= 0) {
          schedule = schedule.map((s) => (s.id === id ? { ...s, ...itemFields } : s));
        } else {
          schedule = [...schedule, { id, note: "", mapLinkGoogle: "", mapLinkNaver: "", url: "", category: "", memberIds: [memberId], ...itemFields }];
        }
      } else {
        schedule = schedule.filter((s) => s.id !== id);
      }
    };

    // 往路の出発 → スケジュールに自動反映
    upsertOrRemove(
      `flight-out-depart-${memberId}`,
      newTravel.startDate && newTravel.flightOutDepart,
      {
        date: newTravel.startDate,
        time: newTravel.flightOutDepart,
        title: `${member?.name || ""} 韓国へ出発！`,
        note: newTravel.flightOutNo ? `便名: ${newTravel.flightOutNo}` : "",
        auto: true,
      }
    );
    // 往路の到着 → スケジュールに自動反映
    upsertOrRemove(
      `flight-out-${memberId}`,
      newTravel.startDate && newTravel.flightOutArrive,
      {
        date: newTravel.startDate,
        time: newTravel.flightOutArrive,
        title: `✈️ ${member?.name || ""} 到着`,
        note: newTravel.flightOutNo ? `便名: ${newTravel.flightOutNo}` : "",

      {
        date: newTravel.endDate,
        time: newTravel.flightInDepart,

        auto: true,
      }

    // 帰りの最終到着 → スケジュールに自動反映
    upsertOrRemove(
      `flight-in-arrive-${memberId}`,
      newTravel.endDate && newTravel.flightInArrive,
      {
        date: newTravel.endDate,
        time: newTravel.flightInArrive,
        title: `${member?.name || ""} 日本着 またね！`,
        note: newTravel.flightInNo ? `便名: ${newTravel.flightInNo}` : "",
        auto: true,
      }
    );

    save({
      ...trip,
      travel: { ...trip.travel, [memberId]: newTravel },

    });

const AIRPORTS = ["仁川", "金浦", "羽田", "成田", "関空", "神戸"];

function AirportSelect({ value, onChange, placeholder }) {
  return (
    <select
      value={value || ""}
      onChange={(e) => onChange(e.target.value)}
      className="w-full rounded-lg px-3 py-2 text-sm outline-none"
      style={inputStyle}
    >
      <option value="">{placeholder || "選択"}</option>

        <option key={a} value={a}>
          {a}
        </option>
      ))}
    </select>
  );
}

function datesBetween(start, end) {
  // nights = start .. end-1 (checkout day itself is not a night stayed)
  if (!start || !end) return [];
  const out = [];
  let d = new Date(start);
  const last = new Date(end);
  while (d < last) {
    out.push(d.toISOString().slice(0, 10));
    d = new Date(d.getTime() + 86400000);
  }
  return out;
}

// ---------- Hotel ----------
function HotelTab({ trip, save }) {
  const addHotel = (copyFrom) => {
    const base = copyFrom
      ? {
          name: copyFrom.name,
          address: copyFrom.address,
          phone: copyFrom.phone,
          mapLink: copyFrom.mapLink,
          bookingLink: copyFrom.bookingLink,
        }
      : { name: "", address: "", phone: "", mapLink: "", bookingLink: "" };
    save({
      ...trip,
      hotels: [
        ...trip.hotels,
        {
          id: uid(),
          ...base,
          memo: "",
          sameAs: copyFrom ? copyFrom.id : null,
          checkIn: "",
          checkOut: "",
          priceKrw: "",
          roomMembers: [],
        },
      ],
    });
  };
  const update = (id, patch) => {
    save({ ...trip, hotels: trip.hotels.map((h) => (h.id === id ? { ...h, ...patch } : h)) });
  };
  const remove = (id) => save({ ...trip, hotels: trip.hotels.filter((h) => h.id !== id) });

  const toggleRoomMember = (h, mid) => {
    let current = h.roomMembers || [];
    if (current.length === 0 && h.nightlyMembers) {
      current = [...new Set(Object.values(h.nightlyMembers).flat())];
    }
    const has = current.includes(mid);
    const next = has ? current.filter((x) => x !== mid) : [...current, mid];
    update(h.id, { roomMembers: next });
  };

  const sendToSettlement = (h) => {
    const price =
      h.priceKrw ||
      (h.nightlyPrices ? Object.values(h.nightlyPrices).reduce((s, v) => s + (parseFloat(v) || 0), 0) : 0);
    if (!price) return;
    let participants = h.roomMembers && h.roomMembers.length > 0 ? h.roomMembers : null;
    if (!participants && h.nightlyMembers) {
      participants = [...new Set(Object.values(h.nightlyMembers).flat())];
    }
    if (!participants || participants.length === 0) participants = trip.members.map((m) => m.id);
    const keepPayer = trip.expenses.find((e) => e.hotelId === h.id)?.payerId;
    const others = trip.expenses.filter((e) => e.hotelId !== h.id);
    const newExpense = {
      id: uid(),
      hotelId: h.id,
      hotelDate: "total",
      date: h.checkIn || "",
      description: `🏨 ${h.name || "ホテル代"}`,
      amountKrw: String(price),
      participants,
      payerId: keepPayer || trip.members[0]?.id || "",
    };
    save({
      ...trip,
      hotels: trip.hotels.map((x) => (x.id === h.id ? { ...x, sentToSettlement: true, priceKrw: String(price), roomMembers: participants } : x)),
      expenses: [...others, newExpense],
    });
  };

  return (
    <div className="space-y-4">
      <Btn onClick={addHotel}>
        <Plus size={15} /> ホテルを追加
      </Btn>
      {trip.hotels.length === 0 && <Empty text="ホテルはまだ登録されていません" />}
      {trip.hotels.map((h) => {
        const nights = datesBetween(h.checkIn, h.checkOut);
        const linkedHotel = h.sameAs ? trip.hotels.find((x) => x.id === h.sameAs) : null;
        // 旧・日割り形式で入力済みのデータがあれば、新しい形式の初期値として引き継ぐ
        const legacyPrice =
          !h.priceKrw && h.nightlyPrices
            ? Object.values(h.nightlyPrices).reduce((s, v) => s + (parseFloat(v) || 0), 0)
            : null;
        const legacyMembers =
          (!h.roomMembers || h.roomMembers.length === 0) && h.nightlyMembers
            ? [...new Set(Object.values(h.nightlyMembers).flat())]
            : null;
        const displayPrice = h.priceKrw || (legacyPrice > 0 ? String(legacyPrice) : "");
        const displayRoomMembers = h.roomMembers && h.roomMembers.length > 0 ? h.roomMembers : legacyMembers || [];
        return (
        <Card key={h.id}>
          {linkedHotel ? (
            <div className="flex justify-between items-start mb-2">
              <div className="text-sm font-medium" style={{ color: C.ink }}>
                🏨 {linkedHotel.name || "（同じホテル）"}
                <span className="text-xs font-normal ml-1.5" style={{ color: C.inkSoft }}>
                  の別の部屋
                </span>
              </div>
              <IconBtn danger onClick={() => remove(h.id)} title="削除" />
            </div>
          ) : (
            <div className="flex justify-between items-start mb-2">
              <TextInput
                placeholder="ホテル名"
                value={h.name}
                onChange={(e) => update(h.id, { name: e.target.value })}
                className="font-medium"
              />
              <IconBtn danger onClick={() => remove(h.id)} title="削除" />
            </div>
          )}
          <div className="grid grid-cols-2 gap-3 mt-2">
            <Field label="チェックイン">
              <TextInput type="date" value={h.checkIn} onChange={(e) => update(h.id, { checkIn: e.target.value })} />
            </Field>
            <Field label="チェックアウト">
              <TextInput type="date" value={h.checkOut} onChange={(e) => update(h.id, { checkOut: e.target.value })} />
            </Field>
          </div>
          {nights.length > 0 && (
            <div className="text-xs mb-2" style={{ color: C.inkSoft }}>
              {nights.length}泊
            </div>
          )}
          {!linkedHotel && (
            <>
          <Field label="住所">
            <TextInput
              placeholder="住所"
              value={h.address || ""}
              onChange={(e) => update(h.id, { address: e.target.value })}
            />
          </Field>
          <Field label="電話番号">
            <TextInput
              placeholder="+82-..."
              value={h.phone || ""}
              onChange={(e) => update(h.id, { phone: e.target.value })}
            />
          </Field>
          <Field label="地図リンク">
            <TextInput
              placeholder="https://..."
              value={h.mapLink}
              onChange={(e) => update(h.id, { mapLink: e.target.value })}
            />
          </Field>
          {h.mapLink && (
            <a
              href={h.mapLink}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center gap-1 text-xs font-medium mb-2 -mt-1"
              style={{ color: C.teal }}
            >
              地図を開く <ExternalLink size={12} />
            </a>
          )}
          <Field label="URL">
            <TextInput
              placeholder="https://..."
              value={h.bookingLink || ""}
              onChange={(e) => update(h.id, { bookingLink: e.target.value })}
            />
          </Field>
          {h.bookingLink && (
            <a
              href={h.bookingLink}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center gap-1 text-xs font-medium mb-2 -mt-1"
              style={{ color: C.persimmon }}
            >
              ページを開く <ExternalLink size={12} />
            </a>
          )}
            </>
          )}

          <Field label="この部屋の金額（合計・ウォン）">
            <MoneyInput value={displayPrice} onChange={(v) => update(h.id, { priceKrw: v })} />
          </Field>

          {trip.members.length > 0 && (
            <div className="mb-3">
              <div className="text-xs font-medium mb-1.5" style={{ color: C.inkSoft }}>
                宿泊メンバー
              </div>
              <div className="flex flex-wrap gap-1.5">
                {trip.members.map((m) => {
                  const on = displayRoomMembers.includes(m.id);
                  return (
                    <button
                      key={m.id}
                      onClick={() => toggleRoomMember(h, m.id)}
                      className="text-xs px-2.5 py-1 rounded-full"
                      style={
                        on
                          ? { background: C.persimmon, color: "white" }
                          : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
                      }
                    >
                      {m.emoji || "😀"} {m.name}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <Field label="メモ">
            <textarea
              value={h.memo || ""}
              onChange={(e) => update(h.id, { memo: e.target.value })}
              rows={2}
              placeholder="部屋タイプ、朝食有無など"
              className="w-full rounded-xl px-3 py-2 text-sm outline-none resize-none"
              style={{ background: "white", color: C.ink, border: `1px solid ${C.line}` }}
            />
          </Field>

          {displayPrice && (
            <div className="mt-3">
              <Btn
                variant="ghost"
                onClick={() => sendToSettlement(h)}
              >
                <Wallet size={14} /> {h.sentToSettlement ? "精算を最新の内容に更新する" : "精算に追加する"}
              </Btn>
            </div>
          )}
          {(linkedHotel || h.name) && (
            <button
              onClick={() => addHotel(linkedHotel || h)}
              className="mt-3 text-xs inline-flex items-center gap-1"
              style={{ color: C.inkSoft }}
            >
              <Plus size={12} /> 同じホテルで部屋をもう1つ追加（名前や住所を引き継ぎます）
            </button>
          )}
        </Card>
        );
      })}
    </div>
  );
}

// ---------- Schedule ----------
function ScheduleTab({ trip, save, myId }) {
  const update = (id, patch) =>
    save({ ...trip, schedule: trip.schedule.map((s) => (s.id === id ? { ...s, ...patch } : s)) });
  const remove = (id) => save({ ...trip, schedule: trip.schedule.filter((s) => s.id !== id) });
  const toggleMember = (item, mid) => {
    const has = item.memberIds.includes(mid);
    update(item.id, { memberIds: has ? item.memberIds.filter((x) => x !== mid) : [...item.memberIds, mid] });
  };

  const sorted = [...trip.schedule].sort((a, b) => {
    const d = (a.date || "").localeCompare(b.date || "");
    if (d !== 0) return d;
    return (a.time || "").localeCompare(b.time || "");
  });

  const uniqueDates = [...new Set(sorted.map((s) => s.date).filter(Boolean))].sort();
  const hasUndated = sorted.some((s) => !s.date);
  const [activeDate, setActiveDate] = useState(uniqueDates[0] || (hasUndated ? "" : null));

  useEffect(() => {
    if (activeDate !== null && activeDate !== "" && !uniqueDates.includes(activeDate)) {
      setActiveDate(uniqueDates[0] || (hasUndated ? "" : null));
    }
    // eslint-disable-next-line
  }, [trip.schedule.length]);

  const visible =
    activeDate === null
      ? sorted
      : sorted.filter((s) => (activeDate === "" ? !s.date : s.date === activeDate));

  const [memberFilter, setMemberFilter] = useState([]); // 複数選択（空＝全員）
  const toggleMemberFilter = (mid) =>
    setMemberFilter((f) => (f.includes(mid) ? f.filter((x) => x !== mid) : [...f, mid]));
  const [categoryFilter, setCategoryFilter] = useState("");
  const finalVisible = visible
    .filter((s) => memberFilter.length === 0 || s.memberIds.some((id) => memberFilter.includes(id)))
    .filter((s) => !categoryFilter || s.category === categoryFilter);

  const [viewMode, setViewMode] = useState("simple"); // simple | detail

  const [showAddForm, setShowAddForm] = useState(false);
  const emptyDraft = () => ({
    date: activeDate || "",
    time: "",
    title: "",
    category: "",
    note: "",
    mapLinkGoogle: "",
    mapLinkNaver: "",
    url: "",
    memberIds: memberFilter,
  });
  const [draft, setDraft] = useState(emptyDraft);
  const patchDraft = (patch) => setDraft((d) => ({ ...d, ...patch }));
  const toggleDraftMember = (mid) => {
    const has = draft.memberIds.includes(mid);
    patchDraft({ memberIds: has ? draft.memberIds.filter((x) => x !== mid) : [...draft.memberIds, mid] });
  };
  const startAdd = () => {
    setDraft(emptyDraft());
    setShowAddForm(true);
  };
  const cancelAdd = () => setShowAddForm(false);
  const submitAdd = () => {
    if (!draft.title.trim()) return;
    save({ ...trip, schedule: [...trip.schedule, { id: uid(), ...draft, title: draft.title.trim() }] });
    setShowAddForm(false);
  };

  return (
    <div className="space-y-4">
      <div className="flex gap-2">
        <button
          onClick={() => setViewMode("simple")}
          className="flex-1 py-2 rounded-full text-sm font-medium"
          style={
            viewMode === "simple"
              ? { background: C.persimmon, color: "white" }
              : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
          }
        >
          一覧
        </button>
        <button
          onClick={() => setViewMode("detail")}
          className="flex-1 py-2 rounded-full text-sm font-medium"
          style={
            viewMode === "detail"
              ? { background: C.persimmon, color: "white" }
              : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
          }
        >
          編集
        </button>
      </div>

      {!showAddForm && (
        <Btn onClick={startAdd}>
          <Plus size={15} /> 予定を追加
        </Btn>
      )}

      {trip.members.length > 0 && (
        <div className="flex flex-wrap gap-1.5">
          <button
            onClick={() => setMemberFilter([])}
            className="px-2.5 py-1 rounded-full text-xs font-medium"
            style={
              memberFilter.length === 0
                ? { background: C.night, color: "white" }
                : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
            }
          >
            全員
          </button>
          {trip.members.map((m) => (
            <button
              key={m.id}
              onClick={() => toggleMemberFilter(m.id)}
              className="px-2.5 py-1 rounded-full text-xs font-medium"
              style={
                memberFilter.includes(m.id)
                  ? { background: C.teal, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              {m.emoji || "😀"} {m.name}
            </button>
          ))}
        </div>
      )}

      <div className="flex flex-wrap gap-1.5">
        <button
          onClick={() => setCategoryFilter("")}
          className="px-2.5 py-1 rounded-full text-xs font-medium"

            categoryFilter === ""
              ? { background: C.night, color: "white" }
              : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
          }
        >
          カテゴリ全部
        </button>
        {WISHLIST_CATEGORIES.map((c) => (
          <button
            key={c.id}
            onClick={() => setCategoryFilter(categoryFilter === c.id ? "" : c.id)}
            className="px-2.5 py-1 rounded-full text-xs font-medium"

              categoryFilter === c.id
                ? { background: c.color, color: "white" }
                : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }

          >
            {c.label}
          </button>
        ))}
      </div>

      {(uniqueDates.length > 0 || hasUndated) && (
        <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-4 px-4">
          {uniqueDates.map((d) => (
            <button
              key={d}
              onClick={() => setActiveDate(d)}
              className="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap"
              style={
                activeDate === d
                  ? { background: C.persimmon, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              {fmtDateWithWeekday(d)}
            </button>
          ))}
          {hasUndated && (
            <button
              onClick={() => setActiveDate("")}
              className="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap"
              style={
                activeDate === ""
                  ? { background: C.persimmon, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              日付未定
            </button>
          )}
        </div>
      )}

      {showAddForm && (
        <Card style={{ border: `2px dashed ${C.persimmon}` }}>
          <div className="text-sm font-medium mb-3" style={{ color: C.ink }}>
            新しい予定
          </div>
          <div className="flex gap-2 items-start mb-2">
            <TextInput type="date" value={draft.date} onChange={(e) => patchDraft({ date: e.target.value })} style={{ maxWidth: 140 }} />
            <TextInput type="time" value={draft.time} onChange={(e) => patchDraft({ time: e.target.value })} style={{ maxWidth: 100 }} />
          </div>
          <TextInput
            placeholder="予定タイトル（例: 弘大でランチ）"
            value={draft.title}
            onChange={(e) => patchDraft({ title: e.target.value })}
            className="mb-2"
          />
          <div className="flex flex-wrap gap-1.5 mb-2">
            {WISHLIST_CATEGORIES.map((c) => (
              <button
                key={c.id}
                onClick={() => patchDraft({ category: draft.category === c.id ? "" : c.id })}
                className="px-2.5 py-1 rounded-full text-xs font-medium"
                style={
                  draft.category === c.id
                    ? { background: c.color, color: "white" }
                    : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
                }
              >
                {c.label}
              </button>
            ))}
          </div>
          <textarea
            placeholder="メモ"
            value={draft.note}
            onChange={(e) => patchDraft({ note: e.target.value })}
            className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2"
            style={{ ...inputStyle, minHeight: 50 }}
          />
          <div className="grid grid-cols-2 gap-2 mb-2">
            <TextInput
              placeholder="地図リンク（Google）"
              value={draft.mapLinkGoogle}
              onChange={(e) => patchDraft({ mapLinkGoogle: e.target.value })}
            />
            <TextInput
              placeholder="地図リンク（NAVER）"
              value={draft.mapLinkNaver}
              onChange={(e) => patchDraft({ mapLinkNaver: e.target.value })}
            />
          </div>
          <TextInput
            placeholder="URL（任意・予約ページや紹介サイトなど）"
            value={draft.url}
            onChange={(e) => patchDraft({ url: e.target.value })}
            className="mb-2"
          />
          <div className="text-xs mb-1" style={{ color: C.inkSoft }}>
            参加メンバー
          </div>
          <div className="flex flex-wrap gap-1.5 mb-3">
            {trip.members.map((m) => {
              const on = draft.memberIds.includes(m.id);
              return (
                <button
                  key={m.id}
                  onClick={() => toggleDraftMember(m.id)}
                  className="px-2.5 py-1 rounded-full text-xs font-medium"
                  style={on ? { background: C.teal, color: "white" } : { background: C.cream, color: C.inkSoft }}
                >
                  {m.emoji || "😀"} {m.name}
                </button>
              );
            })}
          </div>
          <div className="flex items-center gap-2">
            <Btn onClick={submitAdd}>
              <Check size={14} /> 登録する
            </Btn>
            <Btn variant="ghost" onClick={cancelAdd}>
              キャンセル
            </Btn>
          </div>
        </Card>
      )}

      {viewMode === "simple" ? (
        <>
          {sorted.length === 0 && <Empty text="予定がまだありません" />}
          {sorted.length > 0 && finalVisible.length === 0 && <Empty text="条件に合う予定がありません" />}
          <Card className="!p-0 overflow-hidden">
            {finalVisible.map((s, idx) => (
              <button
                key={s.id}
                onClick={() => setViewMode("detail")}
                className="w-full flex items-center gap-2 px-4 py-2.5 text-left"
                style={{
                  borderBottom: idx < finalVisible.length - 1 ? `1px solid ${C.line}` : "none",
                }}
              >
                <span
                  className="text-xs shrink-0 w-11"
                  style={{ color: C.inkSoft, fontFamily: "'Quicksand', monospace" }}
                >
                  {s.time || "--:--"}
                </span>
                <span className="text-sm flex-1 truncate" style={{ color: C.ink }}>
                  {s.title || "（無題）"}
                </span>
                <span className="flex -space-x-1 shrink-0">
                  {s.memberIds.map((mid) => {
                    const m = trip.members.find((mm) => mm.id === mid);
                    return m ? (
                      <span
                        key={mid}
                        className="w-5 h-5 rounded-full flex items-center justify-center text-[11px]"
                        style={{ background: C.cream, border: `1px solid ${C.paper}` }}
                      >
                        {m.emoji || "😀"}
                      </span>
                    ) : null;
                  })}
                </span>
              </button>
            ))}
          </Card>
        </>
      ) : (
        <>
          {sorted.length === 0 && <Empty text="予定がまだありません" />}
          {sorted.length > 0 && finalVisible.length === 0 && <Empty text="条件に合う予定がありません" />}
          {finalVisible.map((s, idx) => {
            return (
            <React.Fragment key={s.id}>
            <Card>
              {s.auto && (
                <div
                  className="text-[10px] mb-1.5 inline-block px-2 py-0.5 rounded-full"
                  style={{ background: C.cream, color: C.inkSoft }}
                >
                  ✈️ 登録タブのフライト情報から自動作成
                </div>
              )}
              <div className="flex gap-2 items-start">
                <TextInput type="date" value={s.date} onChange={(e) => update(s.id, { date: e.target.value })} style={{ maxWidth: 140 }} />
                <TextInput type="time" value={s.time} onChange={(e) => update(s.id, { time: e.target.value })} style={{ maxWidth: 100 }} />
                <TextInput
                  placeholder="予定タイトル（例: 弘大でランチ）"
                  value={s.title}
                  onChange={(e) => update(s.id, { title: e.target.value })}
                />
                <IconBtn danger onClick={() => remove(s.id)} title="削除" />
              </div>
          <div className="flex flex-wrap gap-1.5 mt-2">
            {WISHLIST_CATEGORIES.map((c) => (
              <button
                key={c.id}
                onClick={() => update(s.id, { category: s.category === c.id ? "" : c.id })}
                className="px-2 py-0.5 rounded-full text-[11px] font-medium"
                style={
                  (s.category || "") === c.id
                    ? { background: c.color, color: "white" }
                    : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
                }
              >
                {c.label}
              </button>
            ))}
          </div>
          <div className="flex items-center gap-1.5 flex-wrap mt-1.5">
            <button
              onClick={() => {
                if (!myId) return;
                const ratings = { ...(s.ratings || {}) };
                ratings[myId] = ratings[myId] === "good" ? null : "good";
                update(s.id, { ratings });
              }}
              disabled={!myId}
              className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium"
              style={
                s.ratings?.[myId] === "good"
                  ? { background: C.teal, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}`, opacity: myId ? 1 : 0.5 }
              }
            >
              👍 行ってよかった
              {Object.values(s.ratings || {}).filter((r) => r === "good").length > 0 &&
                ` ${Object.values(s.ratings || {}).filter((r) => r === "good").length}`}
            </button>
            <button
              onClick={() => {
                if (!myId) return;
                const ratings = { ...(s.ratings || {}) };
                ratings[myId] = ratings[myId] === "bad" ? null : "bad";
                update(s.id, { ratings });
              }}
              disabled={!myId}
              className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium"
              style={
                s.ratings?.[myId] === "bad"
                  ? { background: C.persimmon, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}`, opacity: myId ? 1 : 0.5 }
              }
            >
              🙅 イマイチだった
              {Object.values(s.ratings || {}).filter((r) => r === "bad").length > 0 &&
                ` ${Object.values(s.ratings || {}).filter((r) => r === "bad").length}`}
            </button>
            {!myId && (
              <span className="text-[11px]" style={{ color: C.inkSoft }}>
                （持ち物タブで自分を選ぶと評価できます）
              </span>
            )}
          </div>
          <div className="mt-2">
            <textarea
              placeholder="メモ"
              value={s.note}
              onChange={(e) => update(s.id, { note: e.target.value })}
              className="w-full rounded-lg px-3 py-2 text-sm outline-none"
              style={{ ...inputStyle, minHeight: 50 }}
            />
          </div>
          <div className="mt-2">
            <div className="grid grid-cols-2 gap-2 mb-1.5">
              <TextInput
                placeholder="地図リンク（Google）"
                value={s.mapLinkGoogle || ""}
                onChange={(e) => update(s.id, { mapLinkGoogle: e.target.value })}
              />
              <TextInput
                placeholder="地図リンク（NAVER）"
                value={s.mapLinkNaver || ""}
                onChange={(e) => update(s.id, { mapLinkNaver: e.target.value })}
              />
            </div>
            {(s.mapLinkGoogle || s.mapLinkNaver) && (
              <div className="flex items-center gap-1.5 mb-2">
                <MapLinkBadge href={s.mapLinkGoogle} kind="google" />
                <MapLinkBadge href={s.mapLinkNaver} kind="naver" />
              </div>
            )}
            <TextInput
              placeholder="URL（任意・予約ページや紹介サイトなど）"
              value={s.url || ""}
              onChange={(e) => update(s.id, { url: e.target.value })}
            />
            {s.url && (
              <a
                href={s.url}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-1 text-xs font-medium mt-1.5"
                style={{ color: C.persimmon }}
              >
                リンクを開く <ExternalLink size={12} />
              </a>
            )}
          </div>
          <div className="text-xs mt-2 mb-1" style={{ color: C.inkSoft }}>
            参加メンバー
          </div>
          <div className="flex flex-wrap gap-1.5">
            {trip.members.map((m) => {
              const on = s.memberIds.includes(m.id);
              return (
                <button
                  key={m.id}
                  onClick={() => toggleMember(s, m.id)}
                  className="px-2.5 py-1 rounded-full text-xs font-medium"
                  style={on ? { background: C.teal, color: "white" } : { background: C.cream, color: C.inkSoft }}
                >
                  {m.emoji || "😀"} {m.name}
                </button>
              );
            })}
          </div>
        </Card>
        {idx < finalVisible.length - 1 && (
          <RouteBetween from={s} to={finalVisible[idx + 1]} />
        )}
        </React.Fragment>
        );
          })}
        </>
      )}
    </div>
  );
}

// ---------- Money ----------
function Money({ trip, save, myId, initialView, setTab }) {
  const [view, setView] = useState(initialView || "detail"); // detail | result
  const [expanded, setExpanded] = useState({});
  const toggleExpand = (id) => setExpanded((e) => ({ ...e, [id]: !e[id] }));

  const addExpense = () => {
    const id = uid();
    save({
      ...trip,
      expenses: [
        ...trip.expenses,
        {
          id,
          date: "",
          description: "",
          payerId: trip.members[0]?.id || "",
          amountKrw: "",
          participants: trip.members.map((m) => m.id),
        },
      ],
    });
    setExpanded((e) => ({ ...e, [id]: true }));
  };
  const update = (id, patch) =>
    save({ ...trip, expenses: trip.expenses.map((e) => (e.id === id ? { ...e, ...patch } : e)) });
  const remove = (id) => save({ ...trip, expenses: trip.expenses.filter((e) => e.id !== id) });
  const toggleParticipant = (exp, mid) => {
    const has = exp.participants.includes(mid);
    if (has && exp.participants.length <= 1) return; // 割り勘対象を0人にはできない
    update(exp.id, {
      participants: has ? exp.participants.filter((x) => x !== mid) : [...exp.participants, mid],
    });
  };

  const totalJpy = trip.expenses.reduce((s, e) => s + krwToJpy(e.amountKrw, e.exchangeRate || trip.exchangeRate), 0);

  const balances = trip.members.map((m) => {
    let paid = 0;
    let share = 0;
    trip.expenses.forEach((e) => {
      const jpy = krwToJpy(e.amountKrw, e.exchangeRate || trip.exchangeRate);
      if (e.payerId === m.id) paid += jpy;
      if (e.participants.includes(m.id) && e.participants.length > 0) {
        share += jpy / e.participants.length;
      }
    });
    return { member: m, paid, share, balance: paid - share };
  });

  const sortedExpenses = [...trip.expenses].sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  return (
    <div className="space-y-4">
      <div className="flex gap-2">
        <button
          onClick={() => setView("detail")}
          className="flex-1 py-2 rounded-full text-sm font-medium"
          style={
            view === "detail"
              ? { background: C.persimmon, color: "white" }
              : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
          }
        >
          明細
        </button>
        <button
          onClick={() => setView("result")}
          className="flex-1 py-2 rounded-full text-sm font-medium"
          style={
            view === "result"
              ? { background: C.persimmon, color: "white" }
              : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
          }
        >
          結果
        </button>
      </div>

      {view === "detail" ? (
        <>
          <Card>
            <div className="text-sm font-medium mb-2" style={{ color: C.ink }}>
              為替レート
            </div>
            <div className="flex items-center gap-2 text-sm">
              <span style={{ color: C.inkSoft }}>1,000ウォン =</span>
              <TextInput
                type="number"
                value={trip.exchangeRate}
                onChange={(e) => save({ ...trip, exchangeRate: e.target.value })}
                style={{ width: 90 }}
              />
              <span style={{ color: C.inkSoft }}>円</span>
            </div>
          </Card>

          <Btn onClick={addExpense}>
            <Plus size={15} /> 支出を追加
          </Btn>

          {trip.expenses.length === 0 && <Empty text="支出はまだありません" />}
          {sortedExpenses.map((e) => {
            const open = !!expanded[e.id];
            const payer = trip.members.find((m) => m.id === e.payerId);
            return (
              <Card key={e.id}>
                <button
                  onClick={() => toggleExpand(e.id)}
                  className="w-full flex items-center gap-2 text-left"
                >
                  <span className="text-xs shrink-0" style={{ color: C.inkSoft, fontFamily: "'Quicksand', monospace" }}>
                    {e.date ? e.date.slice(5) : "--/--"}
                  </span>
                  <span className="text-sm flex-1 truncate" style={{ color: C.ink }}>
                    {e.description || "（内容未入力）"}
                  </span>
                  {payer && (
                    <span className="text-xs shrink-0" style={{ color: C.inkSoft }}>
                      {payer.emoji || "😀"}
                    </span>
                  )}
                  <span
                    className="text-sm font-semibold shrink-0"
                    style={{ color: C.ink, fontFamily: "'Quicksand', monospace" }}
                  >
                    {e.amountKrw ? yen(krwToJpy(e.amountKrw, e.exchangeRate || trip.exchangeRate)) : "-"}
                  </span>
                  <ChevronDown
                    size={16}
                    style={{ color: C.inkSoft, transform: open ? "rotate(180deg)" : "none", transition: "transform 200ms" }}
                  />
                </button>

                {open && (
                  <div className="mt-3">
                    <div className="flex gap-2 mb-2">
                      <TextInput type="date" value={e.date} onChange={(ev) => update(e.id, { date: ev.target.value })} style={{ maxWidth: 140 }} />
                      <TextInput
                        placeholder="内容（例: タクシー代）"
                        value={e.description}
                        onChange={(ev) => update(e.id, { description: ev.target.value })}
                      />
                      <IconBtn danger onClick={() => remove(e.id)} title="削除" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="立て替えた人">
                        <select
                          value={e.payerId}
                          onChange={(ev) => update(e.id, { payerId: ev.target.value })}
                          className="w-full rounded-lg px-3 py-2 text-sm outline-none"
                          style={inputStyle}
                        >
                          {trip.members.map((m) => (
                            <option key={m.id} value={m.id}>
                              {m.emoji || "😀"} {m.name}
                            </option>
                          ))}
                        </select>
                      </Field>
                      <Field label="金額（ウォン）">
                        <MoneyInput value={e.amountKrw} onChange={(v) => update(e.id, { amountKrw: v })} />
                      </Field>
                    </div>
                    <div className="mb-3">
                      <label className="text-xs" style={{ color: C.inkSoft }}>
                        このカードのレート（未入力なら共通レート {trip.exchangeRate}円/1,000₩ を使用）
                      </label>
                      <div className="flex items-center gap-2 text-sm mt-1">
                        <span style={{ color: C.inkSoft }}>1,000ウォン =</span>
                        <TextInput
                          type="number"
                          placeholder={String(trip.exchangeRate)}
                          value={e.exchangeRate || ""}
                          onChange={(ev) => update(e.id, { exchangeRate: ev.target.value })}
                          style={{ width: 90 }}
                        />
                        <span style={{ color: C.inkSoft }}>円</span>
                      </div>
                    </div>
                    <div className="text-xs mb-1" style={{ color: C.inkSoft }}>
                      割り勘の対象（＝一緒に使った人）
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      {trip.members.map((m) => {
                        const on = e.participants.includes(m.id);
                        return (
                          <button
                            key={m.id}
                            onClick={() => toggleParticipant(e, m.id)}
                            className="px-2.5 py-1 rounded-full text-xs font-medium"
                            style={on ? { background: C.persimmon, color: "white" } : { background: C.cream, color: C.inkSoft }}
                          >
                            {m.emoji || "😀"} {m.name}
                          </button>
                        );
                      })}
                    </div>
                    {e.amountKrw && (
                      <div className="text-xs mt-2 text-right" style={{ color: C.teal, fontFamily: "'Quicksand', monospace" }}>
                        ≈ {yen(krwToJpy(e.amountKrw, trip.exchangeRate))}
                      </div>
                    )}
                  </div>
                )}
              </Card>
            );
          })}
        </>
      ) : (
        <>
          <div className="rounded-3xl p-5 text-white" style={{ background: C.night }}>
            <div className="text-xs tracking-widest mb-1" style={{ color: C.gold }}>
              TOTAL
            </div>
            <div className="text-2xl font-bold" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif" }}>
              {yen(totalJpy)}
            </div>
          </div>

          {trip.expenses.length === 0 && <Empty text="まだ支出がありません" />}

          {trip.members.length > 0 && trip.expenses.length > 0 && (
            <Card>
              <div className="text-sm font-medium mb-3" style={{ color: C.ink }}>
                精算バランス
              </div>
              <div className="space-y-2">
                {balances.map(({ member, paid, share, balance }) => (
                  <div key={member.id} className="flex items-center justify-between text-sm">
                    <span style={{ color: C.ink }}>{member.emoji || "😀"} {member.name}</span>
                    <span
                      className="font-semibold"
                      style={{
                        color: balance >= 0 ? C.teal : C.persimmon,
                        fontFamily: "'Quicksand', monospace",
                      }}
                    >
                      {balance >= 0 ? "+" : ""}
                      {yen(balance)}
                    </span>
                  </div>
                ))}
              </div>
              <p className="text-[11px] mt-3" style={{ color: C.inkSoft }}>
                プラスは「受け取る」、マイナスは「支払う」金額の目安です（各支出の負担対象人数で割り勘）。
              </p>
            </Card>
          )}

          {trip.members.length > 0 && trip.expenses.length > 0 && (
            <Card>
              <div className="text-sm font-medium mb-3" style={{ color: C.ink }}>
                誰が誰にいくら払う？
              </div>
              {(() => {
                const settlements = settleDebts(balances);
                if (settlements.length === 0) {
                  return (
                    <p className="text-sm" style={{ color: C.inkSoft }}>
                      みんな精算済みです🎉
                    </p>
                  );
                }
                return (
                  <div className="space-y-2.5">
                    {settlements.map((s, i) => (
                      <div
                        key={i}
                        className="flex items-center gap-2 text-sm rounded-xl px-3 py-2.5"
                        style={{ background: C.cream }}
                      >
                        <span className="font-medium" style={{ color: C.ink }}>
                          {s.from.emoji || "😀"} {s.from.name}
                        </span>
                        <span style={{ color: C.inkSoft }}>→</span>
                        <span className="font-medium" style={{ color: C.ink }}>
                          {s.to.emoji || "😀"} {s.to.name}
                        </span>
                        <span
                          className="ml-auto font-bold"
                          style={{ color: C.persimmon, fontFamily: "'Quicksand', monospace" }}
                        >
                          {yen(s.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                );
              })()}
              <p className="text-[11px] mt-3" style={{ color: C.inkSoft }}>
                送金の回数が少なくなるように自動で組み合わせています。
              </p>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

function ShoppingTab({ trip, save, myId }) {
  const [name, setName] = useState("");
  const [showBought, setShowBought] = useState(true);
  const [filterMemberId, setFilterMemberId] = useState("");
  const shopping = trip.shopping || [];

  const addItem = () => {
    if (!name.trim()) return;
    save({
      ...trip,
      shopping: [
        ...shopping,
        { id: uid(), name: name.trim(), url: "", memo: "", bought: false, addedBy: myId || null },
      ],
    });
    setName("");
  };
  const update = (id, patch) =>
    save({ ...trip, shopping: shopping.map((s) => (s.id === id ? { ...s, ...patch } : s)) });
  const remove = (id) => save({ ...trip, shopping: shopping.filter((s) => s.id !== id) });
  const memberById = (id) => trip.members.find((m) => m.id === id);

  const visible = shopping
    .filter((s) => showBought || !s.bought)
    .filter((s) => !filterMemberId || s.addedBy === filterMemberId);
  const boughtCount = shopping.filter((s) => s.bought).length;

  return (
    <div className="space-y-4">
      <Card>
        <div className="text-sm font-medium mb-3" style={{ color: C.ink }}>
          買いたいもの
        </div>
        <div className="flex gap-2">
          <TextInput
            placeholder="商品名（例: マスクパック）"
            value={name}
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addItem()}
          />
          <Btn onClick={addItem}>
            <Plus size={15} />
          </Btn>
        </div>
      </Card>

      {trip.members.length > 0 && (
        <div className="flex flex-wrap gap-1.5">
          <button
            onClick={() => setFilterMemberId("")}
            className="px-2.5 py-1 rounded-full text-xs font-medium"
            style={
              filterMemberId === ""
                ? { background: C.night, color: "white" }
                : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
            }
          >
            全員
          </button>
          {trip.members.map((m) => (
            <button
              key={m.id}
              onClick={() => setFilterMemberId(filterMemberId === m.id ? "" : m.id)}
              className="px-2.5 py-1 rounded-full text-xs font-medium"
              style={
                filterMemberId === m.id
                  ? { background: C.teal, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              {m.emoji || "😀"} {m.name}
            </button>
          ))}
        </div>
      )}

      {shopping.length > 0 && (
        <button
          onClick={() => setShowBought((v) => !v)}
          className="text-xs px-2.5 py-1 rounded-full font-medium inline-flex items-center gap-1"
          style={{ background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }}
        >
          {showBought ? "購入済みを隠す" : `購入済みを表示（${boughtCount}）`}
        </button>
      )}

      {shopping.length === 0 && <Empty text="まだ何もありません" />}
      {shopping.length > 0 && visible.length === 0 && (
        <Empty text={filterMemberId ? "このメンバーが追加したものはありません" : "まだ買っていないものはありません🎉"} />
      )}

      <div className="space-y-2">
        {visible.map((s) => {
          const adder = s.addedBy ? memberById(s.addedBy) : null;
          return (
            <Card key={s.id} className="!py-3">
              <div className="flex items-start gap-2.5">
                <button
                  onClick={() => update(s.id, { bought: !s.bought })}
                  className="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5"
                  style={{
                    background: s.bought ? C.teal : "white",
                    border: `1px solid ${s.bought ? C.teal : C.line}`,
                  }}
                  title={s.bought ? "未購入に戻す" : "購入済みにする"}
                >
                  {s.bought && <Check size={13} color="white" />}
                </button>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5">
                    {adder && (
                      <span className="text-sm shrink-0" title={adder.name}>
                        {adder.emoji || "😀"}
                      </span>
                    )}
                    <input
                      value={s.name}
                      onChange={(e) => update(s.id, { name: e.target.value })}
                      className="text-sm flex-1 bg-transparent outline-none"
                      style={{
                        color: C.ink,
                        textDecoration: s.bought ? "line-through" : "none",
                        opacity: s.bought ? 0.5 : 1,
                      }}
                    />
                  </div>
                  <input
                    placeholder="商品リンク（任意）"
                    value={s.url || ""}
                    onChange={(e) => update(s.id, { url: e.target.value })}
                    className="text-xs w-full bg-transparent outline-none mt-1"
                    style={{ color: C.inkSoft }}

                      style={{ color: C.persimmon }}
