                <IconBtn danger onClick={() => remove(s.id)} title="削除" />
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function Wishlist({ trip, save }) {
  if (trip.members.length === 0) return <Empty text="先にメンバーを登録してください" />;

  const addPlace = (memberId) => {
    const list = trip.wishlist[memberId] || [];
    save({
      ...trip,
      wishlist: { ...trip.wishlist, [memberId]: [...list, { id: uid(), name: "", mapLink: "", url: "", category: "food", memo: "", mustGo: false }] },
    });
  };
  const update = (memberId, placeId, patch) => {
    const list = (trip.wishlist[memberId] || []).map((p) => (p.id === placeId ? { ...p, ...patch } : p));
    save({ ...trip, wishlist: { ...trip.wishlist, [memberId]: list } });
  };
  const remove = (memberId, placeId) => {
    const list = (trip.wishlist[memberId] || []).filter((p) => p.id !== placeId);
    save({ ...trip, wishlist: { ...trip.wishlist, [memberId]: list } });
  };
  const addToSchedule = (memberId, place) => {
    const newItem = {
      id: uid(),
      date: "",
      time: "",
      title: place.name || "(名称未設定)",
      note: place.memo || "",
      mapLinkGoogle: place.mapLink || "",
      url: place.url || "",
      category: place.category || "food",
      memberIds: [memberId],
    };
    const list = (trip.wishlist[memberId] || []).map((pp) =>
      pp.id === place.id ? { ...pp, addedToScheduleId: newItem.id } : pp
    );
    save({
      ...trip,
      schedule: [...trip.schedule, newItem],
      wishlist: { ...trip.wishlist, [memberId]: list },
    });
  };
  const removeFromSchedule = (memberId, place) => {
    const list = (trip.wishlist[memberId] || []).map((pp) =>
      pp.id === place.id ? { ...pp, addedToScheduleId: null } : pp
    );
    save({
      ...trip,
      schedule: trip.schedule.filter((s) => s.id !== place.addedToScheduleId),
      wishlist: { ...trip.wishlist, [memberId]: list },
    });
  };

  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [memberFilter, setMemberFilter] = useState("");
  const [mustGoOnly, setMustGoOnly] = useState(false);
  const filterActive = search.trim() !== "" || categoryFilter !== "" || memberFilter !== "" || mustGoOnly;

  const matches = (p) => {
    if (mustGoOnly && !p.mustGo) return false;
    if (categoryFilter && (p.category || "food") !== categoryFilter) return false;
    if (search.trim() && !p.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  };

  return (
    <div className="space-y-4">
      <Card>
        <TextInput
          placeholder="場所の名前で検索"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <button
          onClick={() => setMustGoOnly((v) => !v)}
          className="mt-2.5 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium"
          style={
            mustGoOnly
              ? { background: C.gold, color: C.night }
              : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
          }
        >
          <Star size={12} fill={mustGoOnly ? C.night : "none"} /> 絶対行きたい
        </button>
        <p className="text-[11px] mt-1.5" style={{ color: C.inkSoft }}>
          ⭐各場所の左上の星をタップすると「絶対行きたい」に登録できます
        </p>
        <p className="text-[11px] mt-1" style={{ color: C.inkSoft }}>
          📅 各場所の「行程に追加」ボタンで、スケジュールに予定として登録できます
        </p>
        <div className="flex flex-wrap gap-1.5 mt-2.5">
          <button
            onClick={() => setCategoryFilter("")}
            className="px-2.5 py-1 rounded-full text-xs font-medium"
            style={
              categoryFilter === ""
                ? { background: C.night, color: "white" }
                : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
            }
          >
            すべて
          </button>
          {WISHLIST_CATEGORIES.map((c) => (
            <button
              key={c.id}
              onClick={() => setCategoryFilter(categoryFilter === c.id ? "" : c.id)}
              className="px-2.5 py-1 rounded-full text-xs font-medium"
              style={
                categoryFilter === c.id
                  ? { background: c.color, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              {c.label}
            </button>
          ))}
        </div>
        <div className="flex flex-wrap gap-1.5 mt-2">
          <button
            onClick={() => setMemberFilter("")}
            className="px-2.5 py-1 rounded-full text-xs font-medium"
            style={
              memberFilter === ""
                ? { background: C.night, color: "white" }
                : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
            }
          >
            全員
          </button>
          {trip.members.map((m) => (
            <button
              key={m.id}
              onClick={() => setMemberFilter(memberFilter === m.id ? "" : m.id)}
              className="px-2.5 py-1 rounded-full text-xs font-medium"
              style={
                memberFilter === m.id
                  ? { background: C.persimmon, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              {m.emoji || "😀"} {m.name}
            </button>
          ))}
        </div>
      </Card>

      {trip.members
        .filter((m) => memberFilter === "" || memberFilter === m.id)
        .map((m) => {
        const all = trip.wishlist[m.id] || [];
        const list = filterActive ? all.filter(matches) : all;
        if (filterActive && list.length === 0) return null;
        return (
          <Card key={m.id}>
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm font-semibold" style={{ color: C.ink }}>
                {m.emoji || "😀"} {m.name} の行きたい場所
              </span>
              <Btn variant="ghost" onClick={() => addPlace(m.id)}>
                <Plus size={14} /> 追加
              </Btn>
            </div>
            {list.length === 0 && <Empty text="まだ登録なし" />}
            <div className="space-y-3">
              {list.map((p) => {
                const cat = categoryInfo(p.category);
                return (
                  <div
                    key={p.id}
                    className="rounded-xl p-3"
                    style={
                      p.mustGo
                        ? { background: "#FBF0DC", border: `1px solid ${C.gold}` }
                        : { background: C.cream }
                    }
                  >
                    <div className="flex items-center gap-2 mb-2">
                      <button
                        onClick={() => update(m.id, p.id, { mustGo: !p.mustGo })}
                        className="shrink-0"
                        title={p.mustGo ? "絶対行きたいを解除" : "絶対行きたいに追加"}
                      >
                        <Star
                          size={18}
                          color={C.gold}
                          fill={p.mustGo ? C.gold : "none"}
                        />
                      </button>
                      <MapPin size={14} color={cat.color} className="shrink-0" />
                      <TextInput
                        placeholder="場所名"
                        value={p.name}
                        onChange={(e) => update(m.id, p.id, { name: e.target.value })}
                      />
                      <IconBtn danger onClick={() => remove(m.id, p.id)} title="削除" />
                    </div>
                    <div className="flex flex-wrap gap-1.5 mb-2">
                      {WISHLIST_CATEGORIES.map((c) => {
                        const on = (p.category || "food") === c.id;
                        return (
                          <button
                            key={c.id}
                            onClick={() => update(m.id, p.id, { category: c.id })}
                            className="px-2.5 py-1 rounded-full text-xs font-medium"
                            style={on ? { background: c.color, color: "white" } : { background: "white", color: C.inkSoft, border: `1px solid ${C.line}` }}
                          >
                            {c.label}
                          </button>
                        );
                      })}
                    </div>
                    <textarea
                      placeholder="メモ（何が売ってる・何が食べたい等）"
                      value={p.memo || ""}
                      onChange={(e) => update(m.id, p.id, { memo: e.target.value })}
                      className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-2"
                      style={{ ...inputStyle, minHeight: 44 }}
                    />
                    <TextInput
                      placeholder="地図リンク"
                      value={p.mapLink}
                      onChange={(e) => update(m.id, p.id, { mapLink: e.target.value })}
                    />
                    {p.mapLink && (
                      <a
                        href={p.mapLink}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-1 text-xs font-medium mt-1.5 mb-2"
                        style={{ color: C.teal }}
                      >
                        地図を開く <ExternalLink size={12} />
                      </a>
                    )}
                    <TextInput
                      placeholder="URL（紹介記事・予約ページなど）"
                      value={p.url || ""}
                      onChange={(e) => update(m.id, p.id, { url: e.target.value })}
                    />
                    {p.url && (
                      <a
                        href={p.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-1 text-xs font-medium mt-1.5"
                        style={{ color: C.persimmon }}
                      >
                        リンクを開く <ExternalLink size={12} />
                      </a>
                    )}
                    <div className="mt-2">
                      {p.addedToScheduleId ? (
                        <button
                          onClick={() => removeFromSchedule(m.id, p)}
                          className="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full"
                          style={{ background: C.teal, color: "white" }}
                        >
                          <Check size={12} /> 行程に追加済み（取り消す）
                        </button>
                      ) : (
                        <button
                          onClick={() => addToSchedule(m.id, p)}
                          className="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full"
                          style={{ background: "white", color: C.persimmon, border: `1px solid ${C.persimmon}` }}
                        >
                          <CalendarDays size={12} /> 行程に追加
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })}
      {filterActive &&
        trip.members
          .filter((m) => memberFilter === "" || memberFilter === m.id)
          .every((m) => (trip.wishlist[m.id] || []).filter(matches).length === 0) && (
          <Empty text="条件に合う場所が見つかりませんでした" />
        )}
    </div>
  );
}

const PACKING_CATEGORIES = [
  { id: "entry", label: "必須" },
  { id: "general", label: "持ち物" },
];
const ENTRY_PRESETS = ["パスポート", "航空券（eチケット）"];

// ホームで選んだ「自分」の状態を表示する小さな帯（持ち物・まとめタブ用）

      className="flex items-center justify-between rounded-2xl px-3.5 py-2.5"
      style={{ background: C.cream, border: `1px solid ${C.line}` }}
    >
      <span className="text-sm" style={{ color: C.ink }}>
        {me ? (
          <>
            {me.emoji || "😀"} <b>{me.name}</b> として操作中

          "自分が誰か、まだ選ばれていません"

function Packing({ trip, save, myId, setMyId, setTab }) {
  const [text, setText] = useState("");
  const [category, setCategory] = useState("general");
  const [dupHint, setDupHint] = useState("");
  const [filterMemberId, setFilterMemberId] = useState("");
  const [personalView, setPersonalView] = useState(true);

  const chooseMyId = (id) => setMyId(id);

  const addItem = (t = text, cat = category) => {
    if (!t.trim()) return;
    const norm = t.trim().toLowerCase();
    const existing = trip.packing.find(
      (p) => (p.category || "general") === cat && p.text.trim().toLowerCase() === norm
    );
    if (existing) {
      // already on the list — just check it off for myself instead of duplicating
      if (myId) {
        const checkedBy = { ...(existing.checkedBy || {}), [myId]: true };
        save({ ...trip, packing: trip.packing.map((p) => (p.id === existing.id ? { ...p, checkedBy } : p)) });
        setDupHint(`「${existing.text}」はもうリストにあったので、自分の分にチェックをつけました`);
      } else {
        setDupHint(`「${existing.text}」はもうリストにあります（上の「あなたは誰？」を選ぶとチェックできます）`);
      }
      setTimeout(() => setDupHint(""), 3000);
      setText("");
      return;
    }
    save({
      ...trip,
      packing: [...trip.packing, { id: uid(), text: t.trim(), category: cat, addedBy: myId || null, checkedBy: {}, claimedBy: {} }],
    });
    setText("");
  };
  const toggleMine = (item) => {
    if (!myId) return;
    const checkedBy = { ...(item.checkedBy || {}) };
    checkedBy[myId] = !checkedBy[myId];
    save({ ...trip, packing: trip.packing.map((p) => (p.id === item.id ? { ...p, checkedBy } : p)) });
  };
  const toggleClaim = (item) => {
    if (!myId) return;
    const claimedBy = { ...(item.claimedBy || {}) };
    claimedBy[myId] = !claimedBy[myId];
    save({ ...trip, packing: trip.packing.map((p) => (p.id === item.id ? { ...p, claimedBy } : p)) });
  };
  const remove = (id) => save({ ...trip, packing: trip.packing.filter((p) => p.id !== id) });
  const memberById = (id) => trip.members.find((m) => m.id === id);

  return (
    <div className="space-y-4">
      {trip.members.length > 0 && <MeIndicator trip={trip} myId={myId} setTab={setTab} />}

      {trip.members.length > 0 && (
        <Card>
          <div className="text-sm font-medium mb-2" style={{ color: C.ink }}>
            アイコンで絞り込み
          </div>
          <div className="flex flex-wrap gap-1.5">
            <button
              onClick={() => setFilterMemberId("")}
              className="px-2.5 py-1 rounded-full text-xs font-medium"
              style={
                filterMemberId === ""
                  ? { background: C.night, color: "white" }
                  : { background: C.cream, color: C.inkSoft, border: `1px solid ${C.line}` }
              }
            >
              全部
            </button>
            {trip.members.map((m) => (
              <button
                key={m.id}
                onClick={() => setFilterMemberId(filterMemberId === m.id ? "" : m.id)}
                className="w-9 h-9 rounded-full flex items-center justify-center text-lg"
                style={
                  filterMemberId === m.id
                    ? { background: C.teal }
                    : { background: "white", border: `1px solid ${C.line}` }
                }
                title={`${m.name}がまだ持っていないものだけ表示`}
              >
                {m.emoji || "😀"}
              </button>
            ))}
          </div>
          {filterMemberId && (
            <p className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
              {memberById(filterMemberId)?.name} さんがまだチェックしていないものだけ表示しています
            </p>
          )}
        </Card>
      )}

      {PACKING_CATEGORIES.map((cat) => {
        const isPersonalCat = cat.id === "general";
        const showOnlyMine = isPersonalCat && personalView && myId;
        const items = trip.packing
          .filter((p) => (p.category || "general") === cat.id)
          .filter((p) => !filterMemberId || !p.checkedBy?.[filterMemberId])
          .filter((p) => !showOnlyMine || p.addedBy === myId || p.claimedBy?.[myId] || p.checkedBy?.[myId]);
        return (
          <Card key={cat.id}>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-medium" style={{ color: C.ink }}>
                {cat.label}
              </div>
              {isPersonalCat && myId && (
                <div className="flex gap-1">
                  <button
                    onClick={() => setPersonalView(true)}
                    className="text-xs px-2 py-1 rounded-full font-medium"
                    style={
                      personalView
                        ? { background: C.persimmon, color: "white" }
                        : { background: C.cream, color: C.inkSoft }
                    }
                  >
                    自分の持ち物
                  </button>
                  <button
                    onClick={() => setPersonalView(false)}
                    className="text-xs px-2 py-1 rounded-full font-medium"
                    style={
                      !personalView
                        ? { background: C.persimmon, color: "white" }
                        : { background: C.cream, color: C.inkSoft }
                    }
                  >
                    みんなの持ち物
                  </button>
                </div>
              )}
            </div>
            <div className="flex gap-2 mb-2">
              <TextInput
                placeholder={`${cat.label}を追加`}
                value={category === cat.id ? text : ""}
                onFocus={() => setCategory(cat.id)}
                onChange={(e) => {
                  setCategory(cat.id);
                  setText(e.target.value);
                }}
                onKeyDown={(e) => e.key === "Enter" && addItem(text, cat.id)}
              />
              <Btn onClick={() => addItem(text, cat.id)}>
                <Plus size={15} />
              </Btn>
            </div>
            {dupHint && category === cat.id && (
              <div className="text-xs mb-2 px-2.5 py-1.5 rounded-lg" style={{ background: C.cream, color: C.persimmon }}>
                {dupHint}
              </div>
            )}
            {cat.id === "entry" && (
              <div className="flex flex-wrap gap-1.5 mb-3">
                {ENTRY_PRESETS.filter((preset) => !items.some((it) => it.text === preset)).map((preset) => (
                  <button
                    key={preset}
                    onClick={() => addItem(preset, "entry")}
                    className="text-xs px-2.5 py-1 rounded-full inline-flex items-center gap-1"
                    style={{ border: `1px dashed ${C.inkSoft}`, color: C.inkSoft }}
                  >
                    <Plus size={11} /> {preset}
                  </button>
                ))}
              </div>
            )}
            {items.length === 0 && (
              <Empty text={showOnlyMine ? "自分で追加した持ち物はまだありません" : "まだ何もありません"} />
            )}
            <div className="space-y-2">
              {items.map((p) => {
                const adder = p.addedBy ? memberById(p.addedBy) : null;
                const checkedBy = p.checkedBy || {};
                const myDone = myId ? !!checkedBy[myId] : false;
                return (
                  <div key={p.id} className="rounded-xl p-2.5" style={{ background: C.cream }}>
                    <div className="flex items-center gap-2">
                      {showOnlyMine ? (
                        <button
                          onClick={() => toggleMine(p)}
                          disabled={!myId}
                          className="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
                          style={{
                            background: myDone ? C.teal : "white",
                            border: `1px solid ${C.persimmon}`,
                          }}
                          title="持った"
                        >
                          {myDone && <Check size={13} color="white" />}
                        </button>
                      ) : (
                        adder && (
                          <span className="text-sm shrink-0" title={adder.name}>
                            {adder.emoji || "😀"}
                          </span>
                        )
                      )}
                      <span
                        className="text-sm flex-1"
                        style={{ color: C.ink, textDecoration: showOnlyMine && myDone ? "line-through" : "none", opacity: showOnlyMine && myDone ? 0.5 : 1 }}
                      >
                        {p.text}
                      </span>
                      <IconBtn danger onClick={() => remove(p.id)} title="削除" />
                    </div>
                    {!showOnlyMine && (
                      <div className="flex flex-wrap gap-1 mt-1.5">
                        {trip.members.map((m) => {
                          const claimed = !!(p.claimedBy || {})[m.id];
                          const packed = !!checkedBy[m.id];
                          const mine = m.id === myId;
                          return (
                            <button
                              key={m.id}
                              onClick={() => mine && toggleClaim(p)}
                              disabled={!mine}
                              title={
                                mine
                                  ? claimed
                                    ? "自分のリストから外す"
                                    : "自分も欲しい・要る"
                                  : `${m.name}（見るだけ）`
                              }
                              className="relative w-6 h-6 rounded-full flex items-center justify-center text-xs"
                              style={{
                                background: claimed ? C.persimmon : "white",
                                border: `1px solid ${mine ? C.persimmon : C.line}`,
                                opacity: mine ? 1 : 0.55,
                                cursor: mine ? "pointer" : "default",
                              }}
                            >
                              {m.emoji || "😀"}
                              {packed && (
                                <span
                                  className="absolute -top-1 -right-1 w-3 h-3 rounded-full flex items-center justify-center"
                                  style={{ background: C.teal }}
                                >
                                  <Check size={8} color="white" />
                                </span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })}
    </div>
  );
}

function Summary({ trip, save, myId, setMyId, setTab }) {
  return (
    <div className="space-y-4">
      {trip.members.length > 0 && <MeIndicator trip={trip} myId={myId} setTab={setTab} />}

      {(trip.schedule.some((s) => Object.values(s.ratings || {}).includes("good")) ||
        trip.schedule.some((s) => Object.values(s.ratings || {}).includes("bad"))) && (
        <Card>
          <div className="text-sm font-medium mb-3" style={{ color: C.ink }}>
            旅のまとめ
          </div>
          {trip.schedule.some((s) => Object.values(s.ratings || {}).includes("good")) && (
            <div className="mb-3">
              <div className="text-xs font-medium mb-1.5" style={{ color: C.teal }}>
                👍 行ってよかった
              </div>
              <div className="flex flex-wrap gap-1.5">
                {trip.schedule
                  .filter((s) => Object.values(s.ratings || {}).includes("good"))
                  .map((s) => (
                    <span
                      key={s.id}
                      className="text-xs px-2.5 py-1 rounded-full"
                      style={{ background: C.cream, color: C.ink, border: `1px solid ${C.line}` }}
                    >
                      {s.title || "（無題）"}（{Object.values(s.ratings).filter((r) => r === "good").length}）
                    </span>
                  ))}
              </div>
            </div>
          )}
          {trip.schedule.some((s) => Object.values(s.ratings || {}).includes("bad")) && (
            <div>
              <div className="text-xs font-medium mb-1.5" style={{ color: C.persimmon }}>
                🙅 イマイチだった
              </div>
              <div className="flex flex-wrap gap-1.5">
                {trip.schedule
                  .filter((s) => Object.values(s.ratings || {}).includes("bad"))
                  .map((s) => (
                    <span
                      key={s.id}
                      className="text-xs px-2.5 py-1 rounded-full"
                      style={{ background: C.cream, color: C.ink, border: `1px solid ${C.line}` }}
                    >
                      {s.title || "（無題）"}（{Object.values(s.ratings).filter((r) => r === "bad").length}）
                    </span>
                  ))}
              </div>
            </div>
          )}
        </Card>
      )}

      <Card>
        <div className="text-sm font-medium mb-2" style={{ color: C.ink }}>
          旅の反省・来年へのメモ
        </div>
        {trip.reflection.length > 0 && (
          <div className="space-y-2 mb-3">
            {trip.reflection.map((r) => {
              const author = trip.members.find((m) => m.id === r.authorId);
              return (
                <div key={r.id} className="rounded-xl p-2.5 flex items-start gap-2" style={{ background: C.cream }}>
                  <span className="text-sm shrink-0" title={author?.name || r.authorName}>
                    {author?.emoji || r.authorEmoji || "🙂"}
                  </span>
                  <p className="text-sm whitespace-pre-wrap flex-1" style={{ color: C.ink }}>
                    {r.text}
                  </p>
                  <IconBtn
                    danger
                    onClick={() =>
                      save({ ...trip, reflection: trip.reflection.filter((x) => x.id !== r.id) })
                    }
                    title="削除"
                  />
                </div>
              );
            })}
          </div>
        )}
        <ReflectionComposer myId={myId} trip={trip} save={save} />
      </Card>
    </div>
  );
}

function ReflectionComposer({ myId, trip, save }) {
  const [draft, setDraft] = useState("");
  const submit = () => {
    if (!draft.trim()) return;
    const author = trip.members.find((m) => m.id === myId);
    save({
      ...trip,
      reflection: [
        ...trip.reflection,
        {
          id: uid(),
          authorId: myId || null,
          authorName: author?.name || "",
          authorEmoji: author?.emoji || "",
          text: draft.trim(),
          date: new Date().toISOString().slice(0, 10),
        },
      ],
    });
    setDraft("");
  };
  return (
    <div>
      <textarea
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        placeholder={myId ? "良かったこと、次は改善したいことなど" : "上の「あなたは誰？」で自分を選ぶと、書いた人が分かるようになります"}
        className="w-full rounded-lg px-3 py-2 text-sm outline-none"
        style={{ ...inputStyle, minHeight: 90 }}
      />
      <div className="mt-2">
        <Btn onClick={submit}>
          <Plus size={15} /> メモを追加
        </Btn>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <AuthGate>
    <App />
  </AuthGate>
);
</script>
</body>
</html>
